title: "StoryStone — The Curious Heritage Detective"
pitch: "Every sculpture has a story. StoryStone investigates the clues and discovers it."
features:
  - "dynamic temple introduction with sourced history and legends"
  - "iconographic analysis — posture, mudras, attributes, companions"
  - "Strands Decider classifies the investigation verdict before any story is told"
  - "evidence-backed story with sources, confidence and explore-further prompts"
eager: false
intro: "StoryStone is a heritage detective for tourists. It researches the temple, analyses the sculpture, assembles the evidence, and only then asks Strands Decider whether there is enough to tell the story — or whether to dig deeper, ask for a closer photo, or admit uncertainty."
intro_normal: "StoryStone runs locally with the AWS User Group Madurai hosted decider. Strands Decider classifies the investigation verdict after every evidence-gathering cycle."
turns:
  - say: "I'm visiting Meenakshi Amman Temple in Madurai. Tell me about this temple."
    narrate: "The tourist enters the temple name and city. StoryStone researches it and presents a sourced introduction."

  - say: "I found a figure with four arms dancing inside a ring of fire, standing on a small dwarf. Who is this?"
    image: "agent/data/images/nataraja_demo.png"
    narrate: "The tourist uploads a sculpture photo and describes what they see. StoryStone analyses the iconographic details, searches heritage references, assembles the evidence, and the decider classifies the verdict."

  - say: "What does the drum in the upper right hand represent? And why is there a dwarf under the feet?"
    narrate: "A follow-up question about the same sculpture. StoryStone answers from the assembled context without re-running the full investigation."

  - say: "Are there other sculptures at this temple I should look for?"
    narrate: "The tourist asks for recommendations. StoryStone draws on the temple context already assembled in the session."
outro: "One decider call per investigation. Calibrated probabilities let the code branch on whether the evidence is strong enough — faster and more honest than asking the model to judge its own confidence."
